<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>AVERON · PS1 collection — трейлер</title>
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* Press Start 2P (Google Fonts, OFL) — 8-битный шрифт, читаемая кириллица */
      @font-face { font-family: "P"; src: url(assets/fonts/press-start-2p-cyrillic-400-normal.woff2) format("woff2"); unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
      @font-face { font-family: "P"; src: url(assets/fonts/press-start-2p-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+2000-206F,U+2212; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; background: #000; overflow: hidden; font-family: "P", monospace; -webkit-font-smoothing: none; }
      #edit { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .layer { position: absolute; inset: 0; pointer-events: none; }

      /* текст: одна строка, по центру, слова выезжают из-под маски */
      .t { position: absolute; left: 0; right: 0; text-align: center; color: #f4f4f2; opacity: 0; white-space: nowrap;
           text-shadow: 0 2px 30px rgba(0,0,0,.6); }
      .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding: .1em .04em; margin: -.1em -.25em; }
      .w > i { display: inline-block; font-style: normal; will-change: transform, filter, opacity; }
      .name { font-size: 40px; font-weight: 400; letter-spacing: 0; line-height: 1.5; }
      .small { font-size: 24px; font-weight: 400; letter-spacing: 0; line-height: 1.6; color: #d9d9d6; }
      .logo { font-size: 38px; font-weight: 400; letter-spacing: .4em; padding-left: .4em; }
      .price { font-size: 84px; font-weight: 400; letter-spacing: 0; line-height: 1.4; }

      /* мокап: футболка + бегущий блик по ткани (маска = сам png) */
      .shirt { position: absolute; left: 70px; top: 380px; width: 940px; height: 980px; opacity: 0; }
      .shirt img, .shirt .sheen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .shirt .sheen { -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;
        background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.16) 50%, transparent 65%);
        background-size: 300% 100%; background-position: 120% 0; mix-blend-mode: screen; }
      .halo { position: absolute; left: 90px; top: 520px; width: 900px; height: 900px; opacity: 0;
              background: radial-gradient(circle, rgba(170,180,200,.16), transparent 62%); }
      #grid { position: absolute; left: 60px; top: 330px; width: 960px; height: 1000px; }
      #grid img { position: absolute; width: 470px; height: 490px; object-fit: contain; opacity: 0; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: screen; }
      .bar { position: absolute; left: 0; right: 0; height: 110px; background: #000; }
      #barT { top: 0; transform-origin: top; } #barB { bottom: 0; transform-origin: bottom; }
      #grain { position: absolute; inset: -260px; background: url(assets/lib/grain.png); opacity: .14; mix-blend-mode: overlay; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.6" data-width="1080" data-height="1920">
      <video id="edit" class="clip" src="assets/edit.mp4" muted playsinline data-start="0" data-duration="34.6" data-track-index="0"></video>
      <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="34.6" data-track-index="9" data-volume="0.9"></audio>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="34.6" data-track-index="10" data-volume="0.75"></audio>

      <div id="titles" class="layer clip" data-start="0" data-duration="34.6" data-track-index="1" data-layout-ignore>
        <div id="logo" class="t logo" style="top: 920px">Аверон</div>
        <div id="coll" class="t name" style="top: 915px; font-size: 52px">PS1 collection</div>

        <div class="halo" id="halo"></div>
        <div class="shirt" id="sh1"><img src="assets/img/1-serafim.png"><div class="sheen" style="-webkit-mask-image:url(assets/img/1-serafim.png);mask-image:url(assets/img/1-serafim.png)"></div></div>
        <div class="shirt" id="sh2"><img src="assets/img/2-gotika.png"><div class="sheen" style="-webkit-mask-image:url(assets/img/2-gotika.png);mask-image:url(assets/img/2-gotika.png)"></div></div>
        <div class="shirt" id="sh3"><img src="assets/img/3-sirena.png"><div class="sheen" style="-webkit-mask-image:url(assets/img/3-sirena.png);mask-image:url(assets/img/3-sirena.png)"></div></div>
        <div class="shirt" id="sh4"><img src="assets/img/4-padshiy.png"><div class="sheen" style="-webkit-mask-image:url(assets/img/4-padshiy.png);mask-image:url(assets/img/4-padshiy.png)"></div></div>
        <div id="n1" class="t name" style="top: 1400px">Серафим в бинтах</div>
        <div id="n2" class="t name" style="top: 1400px">Готика ракурс сверху</div>
        <div id="n3" class="t name" style="top: 1400px">Кибер-сирена в очках</div>
        <div id="n4" class="t name" style="top: 1400px">Падший ангел</div>

        <div id="grid">
          <img src="assets/img/1-serafim.png" style="left: 0; top: 0">
          <img src="assets/img/2-gotika.png" style="left: 490px; top: 0">
          <img src="assets/img/3-sirena.png" style="left: 0; top: 510px">
          <img src="assets/img/4-padshiy.png" style="left: 490px; top: 510px">
        </div>
        <div id="price" class="t price" style="top: 1365px">1299 руб.</div>

        <div id="site" class="t name" style="top: 860px; font-size: 56px">averonshop.ru</div>
        <div id="ship" class="t small" style="top: 980px">доставка по России 2–7 дней</div>
        <div id="ozon" class="t small" style="top: 1035px; color: #a9a9a6">скоро на Ozon</div>
      </div>

      <div id="fx" class="layer clip" data-start="0" data-duration="34.6" data-track-index="2" data-layout-ignore>
        <div id="flash"></div>
        <div id="grain"></div>
        <div id="fade"></div>
        <div id="barT" class="bar"></div><div id="barB" class="bar"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // слова → маска + внутренний элемент, который выезжает снизу
      function words(sel) {
        const el = document.querySelector(sel);
        const parts = el.textContent.split(" ");
        el.innerHTML = parts.map((p) => `<span class="w"><i>${p}</i></span>`).join(" ");
        return el.querySelectorAll(".w > i");
      }
      // кинематографичное появление: слова поднимаются из-под маски, лёгкий расфокус уходит, строка медленно дышит
      function show(sel, t0, t1, opt = {}) {
        const ws = words(sel);
        tl.set(sel, { opacity: 1 }, t0);
        tl.fromTo(ws, { yPercent: 110, filter: "blur(6px)", opacity: 0 },
          { yPercent: 0, filter: "blur(0px)", opacity: 1, duration: opt.d ?? 0.9, ease: "expo.out", stagger: opt.st ?? 0.08 }, t0);
        tl.fromTo(sel, { scale: 1 }, { scale: opt.grow ?? 1.03, duration: t1 - t0, ease: "none" }, t0);
        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power1.in" }, t1 - 0.4);
      }
      function fade(sel, t0, t1, d = 0.8) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t0);
        tl.to(sel, { opacity: 0, duration: 0.4 }, t1 - 0.4);
      }
      function flash(t, peak = 0.9, dur = 0.45) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: peak, duration: 0.04, ease: "none" }, t - 0.04);
        tl.to("#flash", { opacity: 0, duration: dur, ease: "power2.out" }, t);
      }

      // интро
      tl.fromTo("#logo", { opacity: 0, letterSpacing: "0.9em" }, { opacity: 1, letterSpacing: "0.4em", duration: 1.6, ease: "power2.out" }, 0.5);
      tl.to("#logo", { opacity: 0, filter: "blur(8px)", duration: 0.5 }, 1.9);
      flash(2.4, 0.3, 0.6);
      show("#coll", 7.0, 8.4, { st: 0.12, d: 1.0 });

      // блоки: модель → вспышка → наезд в принт → чистый мокап с названием
      [1, 2, 3, 4].forEach((k) => {
        const s = 8.4 + 3.6 * (k - 1);
        flash(s + 1.2, 1.0, 0.5);
        const m0 = s + 2.2, m1 = s + 3.6;
        const sh = "#sh" + k;
        tl.fromTo(sh, { opacity: 0, scale: 1.12, filter: "blur(14px)" },
          { opacity: 1, scale: 1.0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, m0);
        tl.to(sh, { scale: 0.97, duration: m1 - m0 - 0.7, ease: "none" }, m0 + 0.7);
        tl.fromTo(sh + " .sheen", { backgroundPosition: "120% 0" }, { backgroundPosition: "-20% 0", duration: 1.1, ease: "power1.inOut" }, m0 + 0.2);
        tl.to(sh, { opacity: 0, duration: 0.25, ease: "power1.in" }, m1 - 0.25);
        tl.fromTo("#halo", { opacity: 0 }, { opacity: 1, duration: 0.6 }, m0);
        tl.to("#halo", { opacity: 0, duration: 0.25 }, m1 - 0.25);
        show("#n" + k, m0 + 0.25, m1, { st: 0.07, grow: 1.02 });
      });

      // разгон: короткие вспышки на склейках
      for (let i = 0; i < 8; i++) flash(+(22.8 + i * 0.35).toFixed(2), 0.18 + 0.12 * (i % 3), 0.15);

      // финал: четыре футболки + цена
      flash(25.6, 1.0, 0.8);
      tl.fromTo("#grid img", { opacity: 0, y: 30, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out", stagger: 0.14 }, 25.85);
      tl.fromTo("#grid", { scale: 1.0 }, { scale: 0.97, duration: 3.0, ease: "none" }, 25.6);
      tl.to("#grid img", { opacity: 0, duration: 0.35 }, 28.25);
      show("#price", 26.75, 28.6, { st: 0.1, d: 1.0 });

      show("#site", 28.85, 31.95, { st: 0.1, grow: 1.02 });
      fade("#ship", 29.5, 31.95);
      fade("#ozon", 30.1, 31.95);
      flash(32.4, 0.5, 0.5);

      // рамка, зерно, затемнение в конце
      tl.fromTo(".bar", { scaleY: 0 }, { scaleY: 1, duration: 1.2, ease: "power2.inOut" }, 0);
      tl.fromTo("#grain", { x: 0, y: 0 }, { x: -173, y: -251, duration: 34.6, ease: "steps(415)" }, 0);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 34.25);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
