name: Рендер эпизода (параллельно)

# Ролик режется на куски кадров, каждый кусок рендерит свой сервер GitHub одновременно, потом склейка.
# Запуск: Actions → «Рендер эпизода (параллельно)» → Run workflow → папка эпизода.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Папка эпизода, например episodes/004-tonnel"
        required: true
      chunk:
        description: "Кадров в куске (меньше — больше параллельных серверов)"
        default: "150"

env:
  HF: hyperframes@0.8.185

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes/chrome
          key: hf-${{ env.HF }}-npm-v2
      - name: Зависимости
        timeout-minutes: 10
        run: |
          bash tools/ci-deps.sh
          pip install -q numpy
      - name: Сборка эпизода (тайминги, субтитры, звук)
        run: |
          cd "${{ inputs.episode }}"
          python3 "$GITHUB_WORKSPACE/tools/build.py" .
          if [ -f foley.json ]; then python3 "$GITHUB_WORKSPACE/tools/foley.py" . && python3 "$GITHUB_WORKSPACE/tools/build.py" .; fi
          if [ -f warsound.json ]; then python3 "$GITHUB_WORKSPACE/tools/warsound.py" . && python3 "$GITHUB_WORKSPACE/tools/build.py" .; fi
          if ! ls assets/music.* >/dev/null 2>&1; then python3 "$GITHUB_WORKSPACE/tools/score.py" . && python3 "$GITHUB_WORKSPACE/tools/build.py" .; fi
      - name: План
        id: plan
        run: |
          node tools/dist-render.mjs plan "${{ inputs.episode }}" /tmp/hfplan "${{ inputs.chunk }}" | tail -1 > /tmp/plan.json
          n=$(python3 -c "import json;print(json.load(open('/tmp/plan.json'))['chunkCount'])")
          echo "chunks=$(python3 -c "print(list(range($n)))")" >> "$GITHUB_OUTPUT"
          echo "Кусков: $n"
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: /tmp/hfplan, retention-days: 1 }

  chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes/chrome
          key: hf-${{ env.HF }}-browser-v2
      - name: Зависимости
        timeout-minutes: 10
        run: bash tools/ci-deps.sh browser
      - uses: actions/download-artifact@v4
        with: { name: plan, path: /tmp/hfplan }
      - name: Рендер куска ${{ matrix.i }}
        run: |
          mkdir -p /tmp/chunks
          node tools/dist-render.mjs chunk /tmp/hfplan ${{ matrix.i }} /tmp/chunks/c$(printf %04d ${{ matrix.i }}).mp4
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.i }}", path: /tmp/chunks/*.mp4, retention-days: 1 }

  assemble:
    needs: chunk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes/chrome
          key: hf-${{ env.HF }}-npm-v2
      - name: Зависимости
        timeout-minutes: 10
        run: bash tools/ci-deps.sh 
      - uses: actions/download-artifact@v4
        with: { name: plan, path: /tmp/hfplan }
      - uses: actions/download-artifact@v4
        with: { pattern: "chunk-*", path: /tmp/chunks, merge-multiple: true }
      - name: Склейка и упаковка под телефон
        run: |
          node tools/dist-render.mjs assemble /tmp/hfplan /tmp/chunks /tmp/raw.mp4
          ffmpeg -v error -y -i /tmp/raw.mp4 -c:v libx264 -preset slow -crf 20 -maxrate 9M -bufsize 18M -pix_fmt yuv420p \
            -profile:v high -level 4.1 -g 60 -keyint_min 30 -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:a aac -b:a 192k -ar 48000 -movflags +faststart final.mp4
      - uses: actions/upload-artifact@v4
        with: { name: final, path: final.mp4, retention-days: 7 }
      - name: Ролик в ветку renders
        run: bash tools/push-render.sh final.mp4 "$(basename "${{ inputs.episode }}")"
