<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #c-card { position: absolute; left: 90px; right: 90px; top: 196px; height: 150px; border-radius: 30px; background: rgba(22,26,34,0.95);
      border: 2px solid rgba(255,46,62,0.5); display: flex; align-items: center; gap: 24px; padding: 0 30px; font-family: Montserrat, sans-serif; color: #fff; }
    #c-card b { display: block; font-size: 36px; font-weight: 900; }
    #c-card small { font-family: "JetBrains Mono", monospace; font-size: 22px; color: rgba(255,255,255,0.6); font-weight: 700; }
    #c-wave { position: absolute; left: 90px; right: 90px; top: 380px; height: 120px; }
  </style>
  <div id="root" data-composition-id="call" data-width="1080" data-height="1920">
    <div id="c-card"><div style="width:84px;height:84px;border-radius:50%;background:#ff2e3e;box-shadow:0 0 26px rgba(255,46,62,0.7)"></div>
      <div><b>Аварийная линия</b><small id="c-t">соединение…</small></div></div>
    <canvas id="c-wave" width="900" height="120"></canvas>
  </div>
  <script>
    (function () {
      const S = window.CUES.call;
      const at = (k) => window.CUES[k] - S;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#c-card", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.set("#c-t", { textContent: "входящий голос · 00:01" }, at("voice"));
      const ctx = document.getElementById("c-wave").getContext("2d");
      const st = { t: 0 };
      const draw = () => {
        const t = st.t, talk = t > at("voice") ? 1 : 0.25;
        ctx.clearRect(0, 0, 900, 120);
        ctx.fillStyle = "rgba(255,90,90,0.9)";
        for (let i = 0; i < 90; i++) {
          const h = (6 + 50 * talk * Math.abs(Math.sin(i * 0.7 + t * 9) * Math.sin(i * 0.23 + t * 3.1))) | 0;
          ctx.fillRect(i * 10, 60 - h, 6, h * 2);
        }
      };
      tl.fromTo(st, { t: 0 }, { t: 12, duration: 12, ease: "none", onUpdate: draw }, 0);
      draw();
      window.__timelines["call"] = tl;
    })();
  </script>
</template>
