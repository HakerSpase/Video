<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #1a1916; font-family: Montserrat, sans-serif; color: #fff; }
    .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
    .tag { position: absolute; background: #f2e9c9; color: #1b1a17; font-family: "JetBrains Mono", monospace; font-weight: 800; font-size: 30px; padding: 14px 22px 14px 52px;
      border-radius: 6px; box-shadow: 0 16px 30px rgba(0,0,0,0.6); opacity: 0; }
    .tag::before { content: ""; position: absolute; left: 18px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: #1a1916; }
    .tag b { color: #b10d18; }
    .light { position: absolute; inset: 0; background: radial-gradient(520px 620px at var(--lx, 540px) var(--ly, 800px), rgba(255,250,230,0) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.92) 100%); }
    .dna { position: absolute; left: 640px; top: 500px; width: 280px; height: 520px; opacity: 0; }
    .dna svg { position: absolute; inset: 0; }
  </style>
  <div id="root" data-composition-id="tracks" data-width="1080" data-height="1920">
    <div class="cam" id="cam">
      <div id="bg"></div>
      <div class="tag" id="t1" style="left:120px; top:330px">№1 · СЛЕД ШИНЫ <b>«НИВА»</b></div>
      <div class="dna" id="dna"></div>
      <div class="tag" id="t2" style="left:470px; top:1050px">№2 · <b>ДНК</b></div>
    </div>
    <div class="light" id="lt"></div>
    <div class="cs-series">РЕАЛЬНЫЕ ДЕЛА · <b>ДЕЛО №2</b></div>
    <div class="cs-tag">РЕКОНСТРУКЦИЯ</div>
  </div>
  <script>
    (function () {
      const C = window.CASE, { tl, at, D, $, q, show, punch, shake, flash, cut, slam } = C.scene("tracks", "dna");
      const r = C.rng(21); let g = `<rect width="1080" height="1920" fill="#2a2620"/>`;
      for (let i = 0; i < 500; i++) g += `<circle cx="${r() * 1080}" cy="${r() * 1920}" r="${2 + r() * 10}" fill="${r() < 0.5 ? "#36312a" : "#211e19"}"/>`;
      // две колеи с протектором
      const rut = (x0) => {
        let o = `<path d="M${x0},-40 C${x0 + 60},600 ${x0 - 40},1200 ${x0 + 80},1980" stroke="#171511" stroke-width="120" fill="none"/>`;
        for (let k = 0; k < 44; k++) {
          const t = k / 43, y = -40 + 2020 * t, x = x0 + 60 * Math.sin(t * 3) + 20 * t;
          o += `<path d="M${x - 52},${y} L${x - 10},${y + 18} L${x - 52},${y + 36} M${x + 52},${y} L${x + 10},${y + 18} L${x + 52},${y + 36}" stroke="#0b0a08" stroke-width="9" fill="none"/>`;
        }
        return o;
      };
      g += rut(250) + rut(560);
      // линейка
      g += `<g transform="translate(130,880) rotate(-8)"><rect width="520" height="54" fill="#e8d36a"/>${Array.from({ length: 27 }, (_, i) => `<rect x="${i * 20}" y="0" width="3" height="${i % 5 ? 16 : 30}" fill="#1b1a17"/>`).join("")}</g>`;
      $("#bg").innerHTML = C.svg(g);
      // спираль ДНК
      let d = "";
      for (let k = 0; k < 18; k++) { const y = 30 + k * 26, a = Math.sin(k * 0.55) * 90; d += `<line x1="${140 - a}" y1="${y}" x2="${140 + a}" y2="${y}" stroke="#9fb4d6" stroke-width="4" opacity="0.7"/><circle cx="${140 - a}" cy="${y}" r="9" fill="#ff2e3e"/><circle cx="${140 + a}" cy="${y}" r="9" fill="#3ddc84"/>`; }
      $("#dna").innerHTML = C.svg(d, 280, 520);
      const L = { x: 300, y: 300 }, mv = () => { $("#lt").style.setProperty("--lx", L.x + "px"); $("#lt").style.setProperty("--ly", L.y + "px"); };
      mv();
      tl.to(L, { x: 330, y: 900, duration: at("niva") + 0.5, ease: "sine.inOut", onUpdate: mv }, 0);
      tl.fromTo(q("#cam"), { scale: 1.3 }, { scale: 1.0, duration: at("niva"), ease: "sine.out" }, 0);
      const fr = (s, px, py, ty = 760) => ({ scale: s, transformOrigin: px + "px " + py + "px", x: 540 - px, y: ty - py });
      cut(at("niva"), fr(1.8, 300, 700, 700));
      tl.fromTo(q("#t1"), { opacity: 0, rotation: -12, scale: 1.3 }, { opacity: 1, rotation: -4, scale: 1, duration: 0.25, ease: "power3.in" }, at("niva") + 0.3);
      slam("НИВА", at("niva") + 1.1, { size: 260, top: 520, color: "#ffd23f", hold: 0.8 });
      cut(at("bio"), {});
      tl.to(L, { x: 780, y: 760, duration: 0.6, ease: "power2.out", onUpdate: mv }, at("bio"));
      tl.fromTo(q("#dna"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, at("bio") + 0.2);
      tl.to(q("#dna"), { rotationY: 360, duration: D - at("bio"), ease: "none" }, at("bio") + 0.2);
      tl.fromTo(q("#t2"), { opacity: 0, rotation: -12, scale: 1.3 }, { opacity: 1, rotation: 3, scale: 1, duration: 0.25, ease: "power3.in" }, at("bio") + 1.0);
      punch(at("bio") + 1.25, 0.05);
      window.__timelines["tracks"] = tl;
    })();
  </script>
</template>
