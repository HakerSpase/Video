  <script>

      // сосна крупно, на ней коробка ловушки; за ней изба
      let s = T.sky("night") + T.forest({ seed: 8, y: 1000, h: 560, n: 14, color: "#0b1322", snowy: 0.3 }) + T.ground(1060) + T.cabin({ x: 700, y: 1150, s: 0.55, lit: true });

      show("#t-3", at("storm") + 0.2, D - 0.1);
      window.__timelines["trap"] = tl;
