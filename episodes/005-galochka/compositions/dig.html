<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    #g-timer { position: absolute; left: 0; right: 0; top: 220px; display: flex; flex-direction: column; align-items: center; opacity: 0; font-family: "JetBrains Mono", monospace; color: #fff; }
    #g-timer b { font-size: 150px; font-weight: 800; letter-spacing: 0.02em; text-shadow: 0 8px 40px rgba(0,0,0,0.8); }
    #g-timer small { font-size: 28px; font-weight: 700; letter-spacing: 0.2em; color: rgba(255,255,255,0.7); }
  </style>
  <div id="root" data-composition-id="dig" data-width="1080" data-height="1920">
    <div id="g-timer"><b id="g-t">00:00</b><small>КОПАЕТ РУКАМИ</small></div>
  </div>
  <script>
    (function () {
      const S = window.CUES.dig;
      const at = (k) => window.CUES[k] - S;
      const tl = gsap.timeline({ paused: true });
      const T0 = at("forty");
      const m = { v: 0 };
      tl.to("#g-timer", { opacity: 1, duration: 0.15 }, T0 - 0.1);
      tl.to(m, { v: 40 * 60, duration: at("hears") - T0 - 0.2, ease: "power2.in", onUpdate: () => {
        const v = Math.round(m.v);
        document.getElementById("g-t").textContent = String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
      } }, T0);
      tl.to("#g-timer", { opacity: 0, duration: 0.2 }, at("hears") + 0.1);
      window.__timelines["dig"] = tl;
    })();
  </script>
</template>
