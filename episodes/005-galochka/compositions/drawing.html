  <script>
    (function () {
      const S = window.CUES.drawing;
      const at = (k) => window.CUES[k] - S;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#r-photo", { opacity: 0, y: 30, rotation: -2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "power3.out" }, at("tells") + 0.2);
      tl.to("#r-photo", { opacity: 0, duration: 0.25 }, at("draws") - 0.2);

      // рисунок появляется штрих за штрихом; фломастер то пишет, то нет
      const P0 = at("marker");
      tl.fromTo("#r-paper", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, P0 - 0.1);
      const strokes = document.querySelectorAll("#r-paper .r-s");
      const span = window.CUES.pocket - window.CUES.marker - 0.9;
      strokes.forEach((p, i) => {
        const L = p.getTotalLength();
        // «сухой» фломастер: в штрихе случайные пропуски
        const dry = i % 3 === 1;
        p.style.strokeDasharray = dry ? "38 9 60 14 22 7 " + L : L + " " + L;
        p.style.opacity = dry ? 0.55 : 0.85;
        tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: span / strokes.length * 1.4, ease: "none" }, P0 + (i * span) / strokes.length);
      });
      document.querySelectorAll("#r-paper .r-t").forEach((t, i) => tl.fromTo(t, { opacity: 0 }, { opacity: 0.9, duration: 0.08 }, P0 + span * 0.6 + i * 0.12));
      tl.to("#r-paper", { opacity: 0, duration: 0.25 }, window.CUES.pocket - S - 0.15);
      window.__timelines["drawing"] = tl;
    })();
  </script>
